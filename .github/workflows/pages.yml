name: Pages

# Publishes the privacy policy and the support page, the two public URLs the
# stores ask for. The pages are generated from docs/*.md by `npm run build:privacy`
# and committed, so this only copies them.

on:
  push:
    branches: [main]
    paths:
      - docs/privacy.html
      - docs/support.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the pages
        run: |
          mkdir site
          cp docs/privacy.html docs/support.html site/
          cp docs/support.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
