name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest became 26.04 in October 2026, which Playwright 1.56 cannot install Chromium on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Web export smoke test
        run: npm run build:web
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: PDF active-content check (real pdf.js on fixtures)
        run: npm run check:pdf-security
      - name: Dependency audit (packages that ship in the bundle)
        run: npm run audit:shipped
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Web build under Content-Security-Policy (headless Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run check:web-security
